<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de cadastro</title>
</head>
<body>

    <form action="#" method="post" enctype="multipart/form-data">

        <fieldset>
            <legend>Dados Pessoais</legend>
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" maxlength="100">
            
            <label for="email">E-mail</label>
            <input type="email" name="email" id="email" placeholder="seuemail@gmail.com" required>

            <label for="senha">Senha</label>
            <input type="password" name="senha" id="senha" placeholder="******" maxlength="6" required>

            <label for="cpf">CPF</label>
            <input type="text" name="cpf" id="cpd" placeholder="000.000.000-00" pattern="[0-9]{3}.\[0-9]{3}.\[0-9]{3}-[0-9]{2}" title="Digite o cpf no formato 000.000.000-00">

            <label for="telefone">Telefone</label>
            <input type="tel" name="telefone" id="telefone" placeholder="00 0000-0000" pattern="\([0-9]{2}\)\s[0-9]{5}-[0-9]{4}" title="Digite o telefone no formato 00 0000-0000">
        </fieldset>

        <fieldset>
            <legend>informações Academicas</legend>
            <label for="cursos"></label>
            <select name="cursos" id="cursos" required>
                <option value="">Selecione um curso</option>
                <option value="computacao">Ciência da Computação</option>
                <option value="ds">Desenvolvimento de sistentas</option>
                <option value="internet">Informática para Internet</option>
                <option value="design">Design Gráfico</option>
            </select>
        </fieldset>

        <fieldset>
            <legend></legend>
        </fieldset>

        <fieldset>
            <legend>Sobre você</legend>
            <label for="sobre">Conte um pouco sobre sua experência com tecnologia:</label>
            <br>
            <textarea name="sobre" id="sobre" cols="50" rows="8" maxlength="500" placeholder="Digite sua experiência"></textarea>
        </fieldset>

        <fieldset>
            <legend>Termos</legend>
            <input type="checkbox" name="termos" id="termos" value="aceito" required>
            <label for="termos">Declaro que as informações são verdadeiras</label>
        </fieldset>

        <section>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar Formulário">
            <button type="button">Botão sem ação</button>
        </section>
    </form>
</body>
</html>
